name = "marquee-photo-import"
main = "index.js"
compatibility_date = "2026-07-30"
# Set IMPORT_SECRET with: wrangler secret put IMPORT_SECRET
# Configure APP_ORIGIN for your browser app. Prefer a same-origin /api/albums/* route.
[vars]
APP_ORIGIN = "https://marquee.adafruit-playground.com"
# Optional strict comma-separated source/CDN host allowlist.
ALLOWED_HOSTS = ""
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 240, period = 60 }
