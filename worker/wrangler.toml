name = "adafruit-marquee-web"
main = "index.js"
compatibility_date = "2026-07-30"
# Set IMPORT_SECRET with: wrangler secret put IMPORT_SECRET
# APP_ORIGIN optionally lists the browser origins allowed to call this Worker, comma
# separated. Empty (default) lets any page call the Worker by its own URL.
[vars]
APP_ORIGIN = ""
# Optional strict comma-separated source/CDN host allowlist.
ALLOWED_HOSTS = ""
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 240, period = 60 }
