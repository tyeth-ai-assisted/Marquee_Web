# Publishes public/ to the gh-pages branch, which GitHub Pages serves at
# https://marquee.adafruit-playground.com/
#
# The site is plain static files with no build step, so "deploying" is just
# copying public/ to a branch root. It cannot be served from main directly:
# branch-based Pages only reads a branch's root or /docs, and /docs holds the
# wire-format specs.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys racing would force-push over each other.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 21+ : the test script relies on node expanding the --test globs itself
          node-version: '24'
      # Miniflare runs importer tests against the real Worker runtime.
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A throwaway repo force-pushed as a single commit, so gh-pages never
      # accumulates history -- the deployed files are disposable output.
      - name: Publish public/ to gh-pages
        working-directory: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Branch-served Pages runs Jekyll, which would drop underscore-prefixed
          # paths and Liquid-template the HTML. Lives in the deploy only.
          touch .nojekyll
          # Custom domain. Must live in the deploy, not public/, for the same
          # reason as .nojekyll: gh-pages is rebuilt from scratch on every push.
          if [ "$GITHUB_REPOSITORY" = "adafruit/Marquee_Web" ]; then
            echo "marquee.adafruit-playground.com" > CNAME
          else
            rm -f CNAME
          fi
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
