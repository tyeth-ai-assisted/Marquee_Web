name: UAT Pages

on:
  push:
    branches: [uat, 'uat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - name: Prepare static site
        env:
          ALBUM_WORKER_URL: ${{ vars.ALBUM_WORKER_URL }}
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # This UAT integration must not change upstream's publishing source or domain.
    if: github.repository == 'tyeth/Marquee_Web' && github.ref == 'refs/heads/uat'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
